services:
  redis:
    image: redis:7-alpine
    container_name: redis_ejercicio3
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data_ejercicio3:/data
    networks:
      - cache_network_ejercicio3
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: postgres_ejercicio3
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cachedb
    volumes:
      - pg_data_ejercicio3:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    networks:
      - cache_network_ejercicio3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./app
    container_name: api_ejercicio3
    restart: always
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cachedb
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - cache_network_ejercicio3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data_ejercicio3:
  pg_data_ejercicio3:

networks:
  cache_network_ejercicio3:
    driver: bridge